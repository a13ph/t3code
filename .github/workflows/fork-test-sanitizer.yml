name: Fork sanitizer checks

# Checks of the remote-file sanitizer change on the file-link branch, on a ci/ branch:
# the shared package typecheck and its markdown pipeline tests.
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-test-sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Sanitizer checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Typecheck shared
        if: ${{ !cancelled() }}
        run: vp run --filter @t3tools/shared typecheck

      - name: Markdown pipeline tests
        if: ${{ !cancelled() }}
        working-directory: packages/shared
        run: vp test run --config ../../vite.config.ts src/markdownPipeline.test.ts
