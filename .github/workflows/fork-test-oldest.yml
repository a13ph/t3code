name: Fork oldest-waiting tests

# The oldest-waiting sidebar tests, the web and contracts typechecks, and the
# check of changed files against the release head, on a ci/ branch.
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-test-oldest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Oldest-waiting checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Web sidebar logic tests
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: vp test run --project unit src/components/Sidebar.logic.test.ts

      - name: Typecheck contracts
        if: ${{ !cancelled() }}
        run: vp run --filter @t3tools/contracts typecheck

      - name: Typecheck web
        if: ${{ !cancelled() }}
        run: npx --no-install tsc --noEmit -p apps/web/tsconfig.json

      - name: Checks of changed files
        if: ${{ !cancelled() }}
        run: vp run check:changed 82223d4bcf
