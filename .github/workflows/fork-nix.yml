name: Fork Nix packages

# Builds the flake's desktop, server and t3-keeper-src packages and pushes
# them to the Cachix cache, so NixOS machines download T3 instead of
# building it. Without the CACHIX_AUTH_TOKEN secret it only builds.

on:
  push:
    branches: [fork-release]
  workflow_dispatch:

concurrency:
  group: fork-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_CACHE: a13ph-t3code

jobs:
  build:
    name: Build and cache
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - run: fork/check-base.sh
      # The T3 build copies node_modules several times; the runner's
      # preinstalled toolchains are not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - name: Build
        run: |
          set -euo pipefail
          nix build --print-build-logs --no-link --print-out-paths \
            .#desktop .#server .#t3-keeper-src | tee out-paths.txt
      - name: Store paths
        run: |
          {
            echo '### Store paths'
            echo
            echo '```'
            cat out-paths.txt
            echo '```'
            if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
              echo
              echo "No CACHIX_AUTH_TOKEN secret: built, not cached."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
